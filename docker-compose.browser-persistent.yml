services:
  chrome-mcp:
    image: zenika/alpine-chrome:124
    command:
      - --no-sandbox
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --remote-allow-origins=*
      - --disable-gpu
      - --disable-dev-shm-usage
      - --user-data-dir=/data/chrome-profile
      - --window-size=1920,1080
    ports:
      - "127.0.0.1:${CHROME_CDP_PORT:-9222}:9222"
    shm_size: 2gb
    volumes:
      - chrome-mcp-profile:/data/chrome-profile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9222/json/version >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    restart: unless-stopped

  goclaw:
    environment:
      - GOCLAW_BROWSER_REMOTE_URL=ws://chrome-mcp:9222
    depends_on:
      chrome-mcp:
        condition: service_healthy

volumes:
  chrome-mcp-profile:
